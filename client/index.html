<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" sizes="192x192" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EU Jobs · AI Powered Careers</title>
    <script>
      // The colour theme picked on this device (lib/theme.js), set before the first paint so dark pages never flash white.
      // Never picked here: the system's light/dark setting (owner 2026-11-17).
      ;(function () {
        var picked = null
        try {
          picked = localStorage.getItem('lwm-pref-theme')
        } catch {}
        var dark = picked === 'dark' || picked === 'light' ? picked === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <script>
      // Signed-out visitors on the landing page: fetch the hero photos (the LCP) in parallel with the app's JS.
      try {
        if (location.pathname === '/' && !localStorage.getItem('lwm-auth-token')) {
          for (const href of ['/landing/hero-man.webp', '/landing/hero-woman.webp']) {
            const link = Object.assign(document.createElement('link'), { rel: 'preload', as: 'image', href, fetchPriority: 'high' })
            document.head.append(link)
          }
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Signed-in visitors: the brand mark instead of a white page while the app's JS and GET /me load (perf 2026-11-24).
      // React replaces it on mount. Signed-out visitors (the landing page) are unchanged.
      try {
        if (localStorage.getItem('lwm-auth-token')) {
          var dark = document.documentElement.dataset.theme === 'dark'
          document.getElementById('root').innerHTML =
            '<div role="status" aria-label="Loading" style="display:grid;place-items:center;min-height:100vh;background:' +
            (dark ? '#0a0b0e' : '#f8f9fb') +
            '"><img src="/favicon.svg" alt="" width="44" height="44"></div>'
        }
      } catch {}
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
